name: diary_app
description: "A diary app built with Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Storage Path
  path_provider: ^2.1.5

  # ID Generation
  uuid: ^4.5.1

  # Date Formatting
  intl: ^0.19.0

  # Image Handling
  image_picker: ^1.1.2

  # Security
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4
  encrypt: ^5.0.3
  crypto: ^3.0.6

  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.1

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Charts
  fl_chart: ^0.69.2

  # Export
  pdf: ^3.11.1
  share_plus: ^10.1.4
  printing: ^5.13.4

  # Backup
  firebase_storage: ^12.3.7



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
